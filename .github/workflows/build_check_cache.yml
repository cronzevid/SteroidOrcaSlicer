name: Check Cache

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      build-deps-only:
        required: false
        type: boolean

jobs:
  check_cache:
    name: Check Cache
    runs-on: ${{ inputs.os }}
    outputs:
      cache-key: ${{ steps.set_outputs.outputs.cache-key }}
      cache-path: ${{ steps.set_outputs.outputs.cache-path }}
      valid-cache: ${{ steps.cache_deps.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'

      - name: set outputs
        id: set_outputs
        run: |
          echo cache-key=linux-clang-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }} >> "$GITHUB_OUTPUT"
          echo cache-path=${{ github.workspace }}/deps/build/OrcaSlicer_dep >> "$GITHUB_OUTPUT"

      - name: load cache
        id: cache_deps
        uses: actions/cache@v5
        with:
          path: ${{ steps.set_outputs.outputs.cache-path }}
          key: ${{ steps.set_outputs.outputs.cache-key }}
          lookup-only: true

  build_deps:
    name: Build Deps
    needs: [check_cache]
    uses: ./.github/workflows/build_deps.yml
    with:
      cache-key: ${{ needs.check_cache.outputs.cache-key }}
      cache-path: ${{ needs.check_cache.outputs.cache-path }}
      valid-cache: ${{ needs.check_cache.outputs.valid-cache == 'true' }}
      os: ${{ inputs.os }}
      build-deps-only: ${{ inputs.build-deps-only }}
